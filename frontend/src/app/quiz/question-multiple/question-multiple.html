<div class="flex grow h-full justify-center">
  <div class="grid grid-cols-2 gap-10 w-3/4 p-10">
    @for (answer of question().answers; track answer) {
      <button
        type="button"
        (click)="selectAnswer(answer)"
        [class.bg-gray-300]="selectedAnswer()?.answer === answer"
        [class.bg-white]="selectedAnswer()?.answer != answer"
        class="shadow transition hover:cursor-pointer"
        [innerHTML]="answer"
      >
      </button>
    }
  </div>
</div>
